<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Help</title>
    <link rel="stylesheet" href="../style.css">
</head>
    
<body>
    <!-- Header -->
    <header class="headerTop">
        <div class="topLevelHeader">
            <h1>Local Skill Emergency Hotline</h1>
            <nav>
                <div class="button">
                    <a href="../index.html">
                        <button>Home</button>
                    </a>
                    <a href="https://evanhwang29.github.io/">
                        <button>Evan's' Portfolio</button>
                    </a>
                    <a href="https://samridhip.github.io/demo-day-portfolio/">
                        <button>Samridhi's Portfolio</button>
                    </a>
                </div>
            </nav>
        </div>
        <h2>Connecting people with local skilled helpers during emergencies.</h2>
    </header>
    <main class= "textCenter">
        <div class="initialClassification">
            <h1> Become a Helper</h1>
            <h2>Fill out the form below to offer your skills and help others in need.</h2>
        </div>
        <form>
            <div class="enterNameForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="enterSkillsForm">
                <label for="skill">Skill</label>
                <select id="skill">
                    <option>Select a Skill</option>
                    <option>Car Repair</option>
                    <option>Plumbing</option>
                    <option>Electrical</option>
                    <option>Home Repair</option>
                    <option>Moving Help</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="enterExperienceForm">
                <label for="experience">Experience</label>
                <textarea id="experience" placeholder="Tell us about your experience..."></textarea>
            </div>
            <div class="enterLocationForm">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="City or Neighborhood">
            </div>
            <div class="enterAvailibilityForm">
                <label for="availability">Availability</label>
                <select id="availability">
                    <option>Select Availability</option>
                    <option>Weekdays</option>
                    <option>Weekends</option>
                    <option>Evenings</option>
                    <option>Available Anytime</option>
                </select>
            </div>
            <div class="enterContactForm">
                <label for="contact">Contact Information</label>
                <input type="text" id="contact" placeholder="Phone or Email">
            </div>
            <button type="submit">Become a Helper</button>
        </form>
        <!--footer-->
        <div>
            <footer class="footer">
                <div class="buttonContainer">
                    <a href="../index.html">
                        <button>Home</button>
                    </a>
                    <a href="../html/request.html">
                        <button>Request</button>
                    </a>
                    <a href="offer.html">
                        <button>Offer</button>
                    </a>
                    <a href="../html/status.html">
                        <button>Status</button>
                    </a>
                </div>
            </footer>
        </div>
    </main> 
</body>
</html>
